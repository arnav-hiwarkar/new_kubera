server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # The application shell must always be revalidated after a deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite filenames contain a content hash and are safe to cache indefinitely.
    # Missing bundles must be a real 404, never the SPA HTML fallback.
    location /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location @missing_asset {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "Asset not found\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
