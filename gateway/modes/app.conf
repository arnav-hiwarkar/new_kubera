# Rate-limit rejections, rendered as the same JSON shape FastAPI returns. The SPA
# parses `detail` out of every error body (frontend/src/api/http.ts), so without
# this an edge-throttled user sees "Request failed with status 429" instead of the
# real notice. Retry-After is a fixed hint: nginx does not expose the leaky
# bucket's drain time, and api_auth refills its burst in ~10s.
location @ratelimited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    return 429 '{"detail":"Too many attempts. Please try again later."}';
}

# 1. Allow public lead capture endpoint from both domains
location = /api/v1/leads/interest {
    # Exact-match locations do not fall through to `location /api/`, so this
    # unauthenticated POST needs the backstop named explicitly.
    limit_req zone=api_general burst=100 nodelay;
    error_page 429 = @ratelimited;

    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

# 2. Block all other application APIs from the marketing domain, and apply the
#    volumetric backstops (KUB-003).
#
#    Both zones are declared here rather than in a separate `^~ /api/v1/auth/`
#    block: api_auth's key is empty for every URI that is not a credential
#    endpoint (see gateway/limits.conf), so it self-selects. A second location
#    would have to duplicate the whole proxy stanza below and would silently
#    drift from it — the earlier attempt at this dropped proxy_read_timeout and
#    proxy_request_buffering, and swept /auth/*/me and /auth/companies into the
#    1r/s bucket.
location /api/ {
    if ($host ~* "^(www\.)?kuberacompliance\.com$") {
        return 403 "Forbidden: Application APIs cannot be accessed from the marketing domain.\n";
    }

    limit_req zone=api_general burst=100 nodelay;
    limit_req zone=api_auth burst=10 nodelay;
    # Concurrency, not request rate, is what reaches the api container's 1 GB
    # limit: an upload or a WeasyPrint render holds memory for as long as it
    # holds its connection (up to proxy_read_timeout below). nginx's client-side
    # keepalive is off, so one connection here is one in-flight request.
    #
    # Sized against nginx's own capacity (worker_connections x workers, in the
    # thousands) rather than against a single browser: an office NAT address can
    # legitimately carry a few hundred in-flight requests during a morning login
    # burst, and a cap tuned for one user would read that as an attack.
    limit_conn api_conn 200;
    error_page 429 = @ratelimited;

    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    # With no size cap, buffering a whole upload to disk before forwarding it adds
    # latency and a second full copy. Stream it straight through instead.
    proxy_request_buffering off;
    # Large uploads and long report renders both outlive the 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 3. Redirect any app routes on the marketing domain to app.kuberacompliance.com
location ~* ^/(app|login|auditor|internal) {
    if ($host ~* "^(www\.)?kuberacompliance\.com$") {
        return 301 https://app.kuberacompliance.com$request_uri;
    }

    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. Serve the marketing landing page and static assets
location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
