# 1. Allow public lead capture endpoint from both domains
location = /api/v1/leads/interest {
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}

# 2. Block all other application APIs from the marketing domain
location /api/ {
    if ($host ~* "^(www\.)?kuberacompliance\.com$") {
        return 403 "Forbidden: Application APIs cannot be accessed from the marketing domain.\n";
    }

    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    # With no size cap, buffering a whole upload to disk before forwarding it adds
    # latency and a second full copy. Stream it straight through instead.
    proxy_request_buffering off;
    # Large uploads and long report renders both outlive the 60s default.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 3. Redirect any app routes on the marketing domain to app.kuberacompliance.com
location ~* ^/(app|login|auditor|internal) {
    if ($host ~* "^(www\.)?kuberacompliance\.com$") {
        return 301 https://app.kuberacompliance.com$request_uri;
    }

    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. Serve the marketing landing page and static assets
location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
