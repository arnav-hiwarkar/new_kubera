server {
    listen 80;
    server_name _;

    # A mode switch must take effect on the next request. Closing upstream
    # keep-alive connections prevents Caddy from holding an old Nginx worker
    # (and therefore the old route) across a graceful configuration reload.
    keepalive_timeout 0;

    # Do not advertise the nginx version.
    server_tokens off;

    # No upload size limit. nginx defaults to 1m, which silently 413'd every
    # document over 1 MiB — including the 2 MB company logos the frontend already
    # permits. A deliberate cap is still wanted eventually; until then the binding
    # constraint is the api container's memory limit, because docvault reads an
    # upload fully into memory before encrypting it.
    client_max_body_size 0;

    resolver 127.0.0.11 valid=5s ipv6=off;

    include /var/lib/kubera-maintenance/active.conf;
}
