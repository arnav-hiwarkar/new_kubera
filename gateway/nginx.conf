server {
    listen 80;
    server_name _;

    # A mode switch must take effect on the next request. Closing upstream
    # keep-alive connections prevents Caddy from holding an old Nginx worker
    # (and therefore the old route) across a graceful configuration reload.
    keepalive_timeout 0;

    resolver 127.0.0.11 valid=5s ipv6=off;

    include /var/lib/kubera-maintenance/active.conf;
}
