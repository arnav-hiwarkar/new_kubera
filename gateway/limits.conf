# Edge rate limiting (KUB-003). Included into the `http` context by nginx's
# stock `include /etc/nginx/conf.d/*.conf`.
#
# ---------------------------------------------------------------------------
# Why real_ip comes first
# ---------------------------------------------------------------------------
# Nothing reaches this container except Caddy, so $remote_addr is ALWAYS Caddy's
# address on the `edge` network (172.x.0.x). Keying a limit_req_zone on
# $binary_remote_addr without real_ip therefore gives every visitor on the
# internet ONE shared bucket: ten requests from a single client exhaust
# `api_auth` for all users at once. That is a denial-of-service switch, not a
# rate limit — verified against the running stack, where the error log recorded
# `client: 172.19.0.3` (Caddy) for every throttled request.
#
# Caddy SETS (does not append) `X-Forwarded-For: {remote_host}` — see the
# reverse_proxy block in ./Caddyfile — so the header arrives here holding
# exactly one value that a client cannot forge. `real_ip_recursive off` takes
# the last value in that header, which is that single trusted entry.
#
# The trusted ranges are the RFC1918 space Docker allocates compose networks
# from. Being generous is safe here: the gateway publishes no port, so the only
# peers that can ever open a connection are services on the `edge` network.
#
# If a CDN is ever put in front of Caddy, fix the Caddyfile first — this file
# inherits whatever Caddy decides the client is.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# ---------------------------------------------------------------------------
# Which URIs count against the strict auth bucket
# ---------------------------------------------------------------------------
# Only the endpoints that accept a credential and can be guessed. An empty value
# means "do not account this request at all", so everything else under
# /api/v1/auth/ falls through to api_general alone.
#
# This deliberately excludes:
#   /api/v1/auth/company/me, /auditor/me   — polled by the SPA on every boot and
#                                            route guard; 1r/s would log users out.
#   /api/v1/auth/*/refresh                 — same, plus it is limited per-IP in
#                                            the application (REFRESH_RATE_LIMIT).
#   /api/v1/auth/companies*                — INTERNAL_API_KEY operator routes that
#                                            ops/kubera-import.sh drives in bulk.
map $uri $auth_bucket {
    default                            "";
    /api/v1/auth/company/login         $binary_remote_addr;
    /api/v1/auth/company/activate      $binary_remote_addr;
    /api/v1/auth/auditor/login         $binary_remote_addr;
    /api/v1/auth/auditor/register      $binary_remote_addr;
}

# Volumetric backstop for the whole API. The application limiter (app/rate_limit.py)
# is the precise, per-identity control; these exist so an attacker cannot reach
# the API's 1 GB memory limit before it runs, and so they keep working when Redis
# is down (the application limiter fails open by design).
#
# api_general is a sanity ceiling, not the security control — read it as
# "per customer", because Kubera is sold to companies and a whole office shares
# one NAT address. 50 seats opening a dashboard at 9am is a few hundred requests
# in a handful of seconds, and `nodelay` REJECTS past burst rather than queueing,
# so a tight rate here logs a tenant out (a 429 on /auth/*/refresh is a forced
# sign-out) instead of stopping an attacker. The controls that actually matter
# are api_auth for guessing and api_conn for memory pressure — report renders and
# spreadsheet imports cost concurrency, not request rate. Raise this first if a
# large tenant reports spurious 429s.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_req_zone $auth_bucket        zone=api_auth:10m    rate=1r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# 503 is the nginx default and reads as "the server broke". 429 is what the SPA
# looks for to render the "try again in N minutes" notice.
limit_req_status 429;
limit_conn_status 429;
