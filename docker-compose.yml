# Kubera — PRODUCTION compose file.
#
# SECURITY INVARIANT: `caddy` is the ONLY service that may publish a port to a
# wildcard address (0.0.0.0). Everything else publishes nothing, or publishes to
# 127.0.0.1 only. `unit_tests/test_compose_exposure.py` enforces this — if you add
# a `ports:` entry here, that test will fail. That is deliberate.
#
# Local development conveniences (published Postgres/Redis ports, --reload, source
# bind-mounts) live in docker-compose.override.yml, which is gitignored and never
# exists on a server. Copy docker-compose.override.yml.example to create it.
# See docs/SECURITY_HARDENING.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sized for a 4 GB host. Total across all services is ~3.3 GB, leaving the
    # host room to breathe. The point is blast-radius containment: without limits
    # a runaway worker OOM-kills whichever process the kernel picks, and that is
    # usually the database.
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` — reachable only from the `data` network (api, worker, beat).
    # Operators reach it with `docker compose exec postgres psql ...`.
    networks:
      - data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    # Password auth is mandatory, not defence-in-depth theatre: Redis is both the
    # Celery broker and the login/activation rate-limit store, so unauthenticated
    # access means task injection and unthrottled credential brute-force.
    environment:
      # `:?` makes compose refuse to start the stack if the password is missing,
      # rather than silently falling back to an unauthenticated Redis.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?not set — add REDIS_PASSWORD to .env, generated with `openssl rand -hex 32`}
    # maxmemory-policy MUST stay noeviction. Redis is the Celery broker, so an
    # LRU policy would silently discard queued tasks under memory pressure —
    # emails and backups would vanish with no error anywhere. noeviction makes
    # Redis reject writes instead, which surfaces as a loud task failure.
    # --save "": no RDB snapshots. No volume is mounted, so snapshots would only
    # burn disk I/O writing state that is discarded on restart anyway.
    command:
      - "sh"
      - "-c"
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy noeviction --save ""'
    # No `ports:` — reachable only from the `data` network.
    networks:
      - data
    healthcheck:
      # A bare `redis-cli ping` returns NOAUTH once requirepass is on, so the
      # healthcheck has to authenticate.
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    # Runs as uid 10001 and needs no privileged operation at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Loopback only. Maintenance mode depends on this (public traffic cannot bypass
    # the gateway via the server's public IP), and ops/kubera-import.sh probes
    # http://127.0.0.1:8000/readyz as a fallback readiness check.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, services are reached by name — these override
      # the host-oriented localhost values in .env (which are for running outside
      # Docker). This keeps container networking correct regardless of .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Absolute container paths, pinned here for the same reason as the URLs
      # above: .env holds HOST-oriented values (./data/vault), and a relative path
      # resolves against WORKDIR /code — writing tenant documents into the
      # container's own filesystem, where they are destroyed by the next
      # `up -d --build`, instead of onto the vault_data volume mounted at
      # /data/vault. Never take these two from .env.
      VAULT_STORAGE_PATH: /data/vault
      BACKUP_PATH: /data/backups
    # `api` bridges both networks: it serves the gateway on `edge` and reaches
    # Postgres/Redis on `data`. caddy/gateway/frontend have no route to `data`.
    networks:
      - edge
      - data
    volumes:
      - vault_data:/data/vault
      - backup_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    # Runs as uid 10001 and needs no privileged operation at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Pinned absolute container paths — see the note on `api`.
      VAULT_STORAGE_PATH: /data/vault
      BACKUP_PATH: /data/backups
    networks:
      - data
    volumes:
      - vault_data:/data/vault
      - backup_data:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 160m
    # Runs as uid 10001 and needs no privileged operation at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The schedule database lives on a named volume. Without the dev bind-mount of
    # `.:/code` it would otherwise be written to the container filesystem and lost
    # on every recreate, causing beat to re-fire missed schedules after a deploy.
    command: >
      celery -A app.worker.celery_app beat --loglevel=info
      --schedule=/var/lib/kubera-beat/celerybeat-schedule
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Pinned absolute container paths — see the note on `api`.
      VAULT_STORAGE_PATH: /data/vault
      BACKUP_PATH: /data/backups
    networks:
      - data
    volumes:
      - backup_data:/data/backups
      - beat_data:/var/lib/kubera-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    # nginx's master process binds :80, drops its workers to the `nginx` user, and
    # chowns /var/cache/nginx/client_temp on startup. Determined empirically:
    # without CHOWN it exits with
    #   [emerg] chown("/var/cache/nginx/client_temp", 101) failed (Operation not permitted)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    networks:
      - edge
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    networks:
      - edge
    volumes:
      - maintenance_runtime:/var/lib/kubera-maintenance
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # The only intentionally internet-facing service.
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - LANDING_DOMAIN=${LANDING_DOMAIN:-kuberacompliance.com}
    networks:
      - edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy

networks:
  # Public-facing tier: caddy -> gateway -> {api, frontend}.
  edge:
  # Data tier: only api, worker and beat can reach Postgres and Redis. Not marked
  # `internal: true` because worker/beat need outbound egress for SMTP delivery.
  data:

volumes:
  pgdata:
  vault_data:
  backup_data:
  beat_data:
  caddy_data:
  caddy_config:
  maintenance_runtime:
